<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062216">
<title>UNO MÁS Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout : une table de jeu verticale, adversaire en haut, pioche/défausse au centre, ta main en bas. Un seul look (tapis vert), volontairement sombre. */
:root{
  --felt:#0f4d30; --felt-hi:#1f7a4d; --felt-lo:#062216;
  --ink:#f3fbf6; --muted:#a9cdb9; --line:rgba(255,255,255,.16);
  --red:#e53935; --yellow:#fdd835; --green:#43a047; --blue:#1e88e5; --black:#141414;
  --gold:#fdd835; --gold-ink:#3a2a00;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--felt-lo);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#app{height:100%;max-width:480px;margin:0 auto;position:relative;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 42%,var(--felt-hi) 0%,var(--felt) 55%,var(--felt-lo) 100%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{height:52px;border-radius:26px;padding:0 22px;font-weight:900;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:rgba(255,255,255,.1);border:2px solid var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* Cartes */
.card{position:relative;width:62px;height:93px;border-radius:9px;background:#fff;padding:4px;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.45);transition:transform .15s}
.card .in{position:relative;width:100%;height:100%;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card .oval{position:absolute;width:80%;height:62%;background:#fff;border-radius:50%;transform:rotate(-30deg)}
.card .v{position:relative;font-family:var(--f-display);font-size:28px;line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.card .c{position:absolute;font-family:var(--f-display);font-size:11px;color:#fff}
.card .tl{top:2px;left:4px}.card .br{bottom:2px;right:4px;transform:rotate(180deg)}
.c-r .in{background:var(--red)}.c-r .v{color:var(--red)}
.c-y .in{background:var(--yellow)}.c-y .v{color:#f9a825}
.c-g .in{background:var(--green)}.c-g .v{color:var(--green)}
.c-b .in{background:var(--blue)}.c-b .v{color:var(--blue)}
.c-k .in{background:var(--black)}
.c-k .oval{background:conic-gradient(var(--red) 0 25%,var(--blue) 0 50%,var(--green) 0 75%,var(--yellow) 0)}
.c-k .v{color:#fff;font-size:22px}
.back .in{background:var(--black)}.back .oval{background:var(--red)}
.back .v{color:var(--yellow);font-size:15px;transform:rotate(-20deg)}
.big{width:96px;height:144px;border-radius:12px;padding:6px}.big .v{font-size:44px}.big .c{font-size:15px}.big.back .v{font-size:24px}
.mini{width:26px;height:39px;border-radius:4px;padding:2px}.mini .v{display:none}.mini .in{border-radius:3px}

/* Lobby */
.lobby{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.logo .uno{display:inline-block;background:var(--red);color:var(--yellow);font-family:var(--f-display);font-size:72px;line-height:1;padding:10px 30px;border-radius:50%;transform:rotate(-8deg);border:5px solid #fff;text-shadow:4px 4px 0 #000}
.logo .mas{margin-top:12px;font-family:var(--f-display);font-size:30px;letter-spacing:10px;text-shadow:3px 3px 0 #000}
.logo .tag{margin-top:6px;color:var(--muted);font-weight:800;font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.join{display:flex;gap:8px}
.join input{flex:1;min-width:0;height:52px;border-radius:26px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font-family:var(--f-display);font-size:22px;letter-spacing:6px;text-align:center;text-transform:uppercase}
.note{color:var(--muted);font-size:13px;line-height:1.45;max-width:320px}
.rules{text-align:left}.rules summary{cursor:pointer;font-weight:900;color:var(--ink);text-align:center}.rules ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
.famrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:320px}.famrow .btn{min-width:130px}
.quitbtn{font-size:12px;font-weight:900;color:var(--muted);background:rgba(0,0,0,.3);border-radius:12px;padding:5px 10px}
.err{color:#ffb4b0;font-weight:800;font-size:14px;min-height:20px}
.codebox{font-family:var(--f-display);font-size:56px;letter-spacing:12px;color:var(--gold);text-shadow:3px 3px 0 #000}

/* Partie */
.game{flex:1;display:flex;flex-direction:column;min-height:0}
.opp{display:flex;align-items:center;gap:12px;padding:6px 4px}
.avatar{width:46px;height:46px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:20px;flex:none;background:#8e24aa;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.turn{box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold)}
.opp .who{flex:1;min-width:0}
.opp .name{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .backs{display:flex;margin-top:4px}
.opp .backs .card{margin-left:-14px}.opp .backs .card:first-child{margin-left:0}
.badge{background:rgba(0,0,0,.45);border-radius:10px;font-size:12px;font-weight:900;padding:3px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.uno{background:var(--red);color:var(--yellow)}
.table{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0;position:relative}
.piles{display:flex;gap:28px;align-items:center}
.pile{position:relative;width:96px;height:144px}
.pile .card{position:absolute;top:0;left:0}
.drawpile.can{cursor:pointer}
.drawpile.can .card:last-child{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}
.colorchip{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;background:rgba(0,0,0,.3);border-radius:16px;padding:5px 12px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.log{color:var(--muted);font-size:13px;font-weight:800;text-align:center;min-height:18px;padding:0 8px}
.attack{position:absolute;inset:auto 0 0 0;display:flex;justify-content:center}
.attack span{background:var(--red);border:3px solid #fff;border-radius:16px;padding:8px 14px;font-weight:900;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.35);text-align:center}
.bar{display:flex;align-items:center;gap:10px;padding:8px 0}
.turnpill{flex:1;text-align:center;font-family:var(--f-display);font-size:18px;letter-spacing:.5px;padding:10px;border-radius:20px;background:rgba(0,0,0,.3)}
.turnpill.mine{background:var(--gold);color:var(--gold-ink)}
.unobtn{width:64px;height:64px;border-radius:50%;background:var(--red);border:4px solid #fff;font-family:var(--f-display);font-size:19px;color:var(--yellow);box-shadow:0 4px 0 rgba(0,0,0,.4);flex:none}
.unobtn.on{background:var(--yellow);color:var(--red);box-shadow:0 0 0 4px var(--red),0 0 20px var(--yellow)}
.actions{display:flex;gap:10px;justify-content:center;min-height:0}
.actions:empty{display:none}
.actions .btn{flex:1;height:48px;font-size:15px}
.handwrap{overflow-x:auto;overflow-y:hidden;padding:30px 4px 10px;scrollbar-width:none}
.handwrap::-webkit-scrollbar{display:none}
.hand{display:flex;width:max-content;margin:0 auto;padding-right:24px;min-height:93px}
.hand .card{margin-right:-24px}
.hand .card.ok{transform:translateY(-22px);box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold);cursor:pointer}
.hand .card.no{filter:brightness(.6)}
.hand.idle .card{filter:none;transform:none}

/* Fenêtres */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20;text-align:center;padding:24px}
.modal h2{font-family:var(--f-display);font-size:30px;font-weight:400;text-shadow:3px 3px 0 #000;text-wrap:balance}
.modal p{color:var(--muted);font-weight:800}
.wheel{width:260px;height:260px;border-radius:50%;border:6px solid #fff;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;position:relative;max-width:100%}
.wheel button{font-weight:900;font-size:16px;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.wheel button:hover,.wheel button:focus-visible{filter:brightness(1.15)}
.wheel .hub{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;background:var(--black);border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;pointer-events:none}
.trophy{font-size:80px;line-height:1}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:30;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){.card,.btn{transition:none}}
.namefield{height:48px;border-radius:24px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;font-weight:800;font-size:16px;text-align:center;width:100%}
</style>
</head>
<body>

<div id="app"></div>

<script src="peerjs.min.js"></script>
<script>
// ---------- Règles ----------
const COLORS=['r','y','g','b'];
const CNAME={r:'Rouge',y:'Jaune',g:'Vert',b:'Bleu'};
const CVAR={r:'var(--red)',y:'var(--yellow)',g:'var(--green)',b:'var(--blue)'};
const col=c=>c[0], val=c=>c.slice(1);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function newDeck(){const d=[];for(const c of COLORS){d.push(c+'0');for(let i=1;i<=9;i++)d.push(c+i,c+i);for(const v of['S','R','+2'])d.push(c+v,c+v)}for(let i=0;i<4;i++)d.push('kW','k+4');return shuffle(d)}
function freshState(players){
  const deck=newDeck();const p0=deck.splice(0,7),p1=deck.splice(0,7);
  const i=deck.findIndex(c=>col(c)!=='k'&&/^\d$/.test(val(c)));const top=deck.splice(i,1)[0];
  return{players,deck,discard:[top],hands:{p0,p1},turn:0,color:col(top),pending:0,drew:false,uno:-1,winner:-1,log:'La partie commence !',rev:0};
}
const clone=s=>JSON.parse(JSON.stringify(s));
const topCard=s=>s.discard[s.discard.length-1];
const hand=(s,i)=>s.hands['p'+i];
function canPlay(s,card){
  if(s.pending>0){return val(card)==='+4'||(val(card)==='+2'&&val(topCard(s))==='+2')}
  return col(card)==='k'||col(card)===s.color||val(card)===val(topCard(s));
}
function drawN(s,i,n){
  let got=0;
  for(let k=0;k<n;k++){
    if(!s.deck.length){const t=s.discard.pop();s.deck=shuffle(s.discard);s.discard=[t]}
    if(!s.deck.length)break;
    hand(s,i).push(s.deck.pop());got++;
  }
  return got;
}
function label(c){const v=val(c);return v==='S'?'Passe':v==='R'?'Inversion':v==='W'?'Joker':v==='+4'?'+4':v==='+2'?'+2':v}
const P=i=>'{'+i+'}'; // nom du joueur, remplacé à l'affichage
const isSpecial=c=>!/^\d$/.test(val(c));
// Combos : plusieurs Inversions d'un coup, ou une famille (même chiffre, une carte par couleur, 2 à 4 cartes).
function comboFor(s,me,i){
  if(s.pending>0||s.drew)return null;
  const h=hand(s,me),c=h[i],v=val(c);
  if(v==='R'){const idxs=h.map((x,j)=>j).filter(j=>val(h[j])==='R');return idxs.length>1?{kind:'R',idxs}:null}
  if(/^\d$/.test(v)){const by={};h.forEach((x,j)=>{if(val(x)===v&&!(col(x) in by))by[col(x)]=j});
    return Object.keys(by).length>1?{kind:'fam',by}:null}
  return null;
}
function doPlay(s0,me,idxs,chosen,saidUno){
  if(!Array.isArray(idxs))idxs=[idxs];
  const s=clone(s0);const h=hand(s,me);const cards=idxs.map(i=>h[i]);
  [...idxs].sort((a,b)=>b-a).forEach(i=>h.splice(i,1));
  s.discard.push(...cards);const card=cards[cards.length-1];
  s.color=col(card)==='k'?chosen:col(card);s.drew=false;s.uno=-1;s.rev++;
  const v=val(card),other=1-me,who=P(me);
  if(!h.length&&!isSpecial(card)){s.winner=me;s.pending=0;s.log=who+(cards.length>1?' pose '+cards.length+' cartes et gagne !':' a posé sa dernière carte !');return s}
  let lastSpecial=false;
  if(!h.length){drawN(s,me,1);lastSpecial=true}
  if(h.length===1&&!saidUno&&!lastSpecial)s.uno=me;
  if(cards.length>1){s.turn=v==='R'?me:other;s.log=who+' pose '+cards.length+(v==='R'?' Inversions et rejoue':' cartes « '+v+' » ('+CNAME[s.color]+' dessus)')}
  else if(v==='S'||v==='R'){s.turn=me;s.log=who+' joue '+label(card)+' et rejoue'}
  else if(v==='+2'||v==='+4'){
    const contre=s0.pending>0;s.pending+=+v.slice(1);s.turn=other;
    s.log=who+(contre?' contre avec un ':' lance un ')+v+(col(card)==='k'?' ('+CNAME[chosen]+')':'');
  }
  else{s.turn=other;s.log=who+' joue '+(col(card)==='k'?'un Joker ('+CNAME[chosen]+')':label(card)+' '+CNAME[col(card)])}
  if(h.length===1&&saidUno&&!lastSpecial)s.log+=' · UNO !';
  if(lastSpecial)s.log+=' · interdit de finir sur une spéciale : il pioche 1';
  return s;
}
function doDraw(s0,me){
  const s=clone(s0);s.rev++;s.uno=-1;
  if(s.pending>0){const n=drawN(s,me,s.pending);s.log=P(me)+' pioche '+n+' cartes';s.pending=0;s.turn=1-me;s.drew=false}
  else{const n=drawN(s,me,1);const h=hand(s,me);
    if(n&&canPlay(s,h[h.length-1])){s.drew=true;s.log=P(me)+' pioche une carte jouable'}
    else{s.drew=false;s.turn=1-me;s.log=P(me)+' pioche et passe'}}
  return s;
}
function doPass(s0,me){const s=clone(s0);s.rev++;s.drew=false;s.turn=1-me;s.log=P(me)+' passe';return s}
function doCatch(s0,me){const s=clone(s0);s.rev++;const o=1-me;drawN(s,o,2);s.uno=-1;s.log=P(o)+" n'a pas dit UNO : +2 !";return s}

// ---------- État de la page ----------
let mode=null;          // 'online' | 'local'
let S=null, me=0, code=null, peer=null, conn=null, isHost=false, profiles={};
let myName=(()=>{try{return localStorage.getItem('unomas.name')||''}catch(e){return ''}})();
let quitAsk=false, saidUno=false, picking=-1, combo=null, covered=false, lobbyErr='', toastMsg='', toastT=null;

function NAME(i){
  if(mode==='local')return 'Joueur '+(i+1);
  if(i===me)return 'Toi';
  return (S&&S.names&&S.names[i])||'Adversaire';
}
const esc=t=>String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){toastMsg=m;render();clearTimeout(toastT);toastT=setTimeout(()=>{toastMsg='';render()},2600)}

// ---------- Rendu ----------
function cardHTML(c,cls='',attrs=''){
  const v=val(c),k=col(c);
  const sym=v==='S'?'⊘':v==='R'?'⇄':v==='W'?'':v;
  return `<div class="card c-${k} ${cls}" ${attrs}><div class="in"><div class="oval"></div><div class="v">${sym}</div>`+
    (k==='k'&&v==='W'?'':`<div class="c tl">${sym}</div><div class="c br">${sym}</div>`)+`</div></div>`;
}
const backHTML=(cls='',attrs='')=>`<div class="card back ${cls}" ${attrs}><div class="in"><div class="oval"></div><div class="v">UNO</div></div></div>`;
function avatarHTML(i,turn){
  const id=S.players[i];const p=id&&profiles[id];
  const inner=(mode==='online'&&p&&p.avatarUrl)?`<img alt="" src="${esc(p.avatarUrl)}">`:esc((NAME(i)[0]||'?').toUpperCase());
  return `<div class="avatar ${turn?'turn':''}" style="background:${i?'#8e24aa':'#1e88e5'}">${inner}</div>`;
}

function render(){
  const app=document.getElementById('app');
  if(!S||(mode==='online'&&S.players.length<2)){app.innerHTML=lobbyHTML();return finish()}
  const opp=1-me,myTurn=S.turn===me&&S.winner<0;
  const mine=hand(S,me),oh=hand(S,opp);
  let h=`<div class="game">`;
  // Adversaire
  h+=`<div class="opp">${avatarHTML(opp,S.turn===opp&&S.winner<0)}<div class="who"><div class="name">${esc(NAME(opp))}</div>
     <div class="backs">${oh.slice(0,10).map(()=>backHTML('mini')).join('')}</div></div>
     <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
     <button class="quitbtn" data-act="askquit" aria-label="Quitter la partie">✕ Quitter</button>
     <span class="badge ${oh.length===1?'uno':''}">${oh.length===1?'UNO !':oh.length+' cartes'}</span>
     ${S.uno===opp&&S.winner<0?`<button class="btn red" style="height:34px;font-size:13px;padding:0 12px" data-act="catch">Pas dit UNO ! +2</button>`:''}
     </div></div>`;
  // Table
  const canDraw=myTurn&&!S.drew;
  h+=`<div class="table"><div class="piles">
     <div class="pile drawpile ${canDraw?'can':''}" ${canDraw?'data-act="draw" role="button" tabindex="0" aria-label="Piocher"':''}>
       ${[2,1,0].map(i=>backHTML('big',`style="top:${-i*3}px;left:${-i*3}px"`)).join('')}</div>
     <div class="pile">${S.discard.slice(-2).map((c,i,a)=>cardHTML(c,'big',`style="transform:rotate(${i===a.length-1?6:-12}deg)"`)).join('')}</div>
   </div>
   <div class="colorchip"><span class="dot" style="background:${CVAR[S.color]}"></span>Couleur : ${CNAME[S.color]} · pioche ${S.deck.length}</div>
   <div class="log">${esc(S.log.replace(/\{([01])\}/g,(m,d)=>NAME(+d)))}</div>
   ${S.pending>0&&S.winner<0?`<div class="attack"><span>${S.turn===me?'Attaque : +'+S.pending+' pour toi ! Contre avec un '+(val(topCard(S))==='+2'?'+2 ou +4':'+4')+', ou pioche.':esc(NAME(S.turn))+' doit contrer ou piocher '+S.pending}</span></div>`:''}
   </div>`;
  // Barre de tour
  h+=`<div class="bar"><div class="turnpill ${myTurn?'mine':''}">${S.winner>=0?'Partie terminée':myTurn?'À toi de jouer':'Tour de '+esc(NAME(S.turn))}</div>
     <button class="unobtn ${saidUno?'on':''}" data-act="uno" aria-pressed="${saidUno}">UNO!</button></div>`;
  // Actions
  let acts='';
  if(myTurn&&S.pending>0)acts+=`<button class="btn ghost" data-act="draw">Piocher ${S.pending}</button>`;
  if(myTurn&&S.drew)acts+=`<button class="btn ghost" data-act="pass">Passer</button>`;
  h+=`<div class="actions">${acts}</div>`;
  // Main
  h+=`<div class="handwrap"><div class="hand ${myTurn?'':'idle'}">${mine.map((c,i)=>{
      const ok=myTurn&&canPlay(S,c)&&(!S.drew||i===mine.length-1);return cardHTML(c,myTurn?(ok?'ok':'no'):'',ok?`data-act="play" data-i="${i}" role="button" tabindex="0" aria-label="Jouer ${label(c)}"`:'');
    }).join('')}</div></div></div>`;
  // Fenêtres
  if(picking>=0)h+=`<div class="modal"><h2>Choisis une couleur</h2><div class="wheel">
     ${['r','b','y','g'].map(c=>`<button data-act="color" data-c="${c}" style="background:${CVAR[c]}">${CNAME[c]}</button>`).join('')}
     <div class="hub">${val(mine[picking])==='+4'?'+4':'Joker'}</div></div>
     <button class="btn ghost" data-act="cancelpick">Annuler</button></div>`;
  if(combo){const c=mine[combo.i];
    h+=combo.kind==='R'?`<div class="modal"><h2>Tu as ${combo.idxs.length} Inversions</h2><p>Tu peux toutes les poser d'un coup.</p>
      <button class="btn gold" data-act="allR">Poser les ${combo.idxs.length}</button><button class="btn ghost" data-act="one">Poser seulement celle-ci</button>
      <button class="btn ghost" data-act="cancelcombo">Annuler</button></div>`
     :`<div class="modal"><h2>Famille de ${esc(val(c))} !</h2><p>Pose tes ${Object.keys(combo.by).length} cartes « ${esc(val(c))} » d'un coup. Touche la couleur qui reste dessus.</p>
      <div class="famrow">${Object.keys(combo.by).map(k=>`<button class="btn" data-act="fam" data-c="${k}" style="background:${CVAR[k]};color:${k==='y'?'var(--gold-ink)':'#fff'}">${CNAME[k]}</button>`).join('')}</div>
      <button class="btn ghost" data-act="one">Poser seulement ce ${esc(val(c))}</button><button class="btn ghost" data-act="cancelcombo">Annuler</button></div>`}
  if(quitAsk)h+=`<div class="modal"><h2>Quitter la partie ?</h2><p>${mode==='online'?'Ton adversaire sera prévenu. Tu pourras ensuite créer ou rejoindre une autre partie.':'La partie en cours sera perdue.'}</p>
     <button class="btn red" data-act="quit">Quitter la partie</button><button class="btn ghost" data-act="stay">Continuer à jouer</button></div>`;
  else if(S.winner>=0)h+=`<div class="modal"><div class="trophy">${S.winner===me||mode==='local'?'🏆':'😵'}</div>
     <h2>${mode==='local'?esc(NAME(S.winner))+' gagne !':S.winner===me?'Victoire !':esc(NAME(S.winner))+' gagne'}</h2>
     <p>${mode==='local'?'':S.winner===me?'Tu as posé ta dernière carte.':'Il lui restait 0 carte, à toi '+mine.length+'.'}</p>
     <button class="btn gold" data-act="again">Rejouer</button><button class="btn ghost" data-act="leave">Accueil</button></div>`;
  else if(mode==='local'&&covered)h+=`<div class="modal" style="background:var(--felt-lo)"><h2>Passe le téléphone à ${esc(NAME(me))}</h2>
     <p>Les cartes restent cachées jusqu'à ce que ${esc(NAME(me))} soit prêt.</p><button class="btn gold" data-act="reveal">Je suis prêt</button></div>`;
  app.innerHTML=h;finish();
}
function lobbyHTML(){
  const logo=`<div class="logo"><div class="uno">UNO</div><div class="mas">MÁS</div></div>`;
  if(mode==='online'&&isHost)return `<div class="lobby">${logo}
    <p class="note">Donne ce code à ton adversaire, ou envoie-lui le lien. La partie démarre dès qu'il rejoint.</p>
    <div class="codebox">${esc(code)}</div>
    <button class="btn gold" data-act="copy">Copier le lien d'invitation</button>
    <p class="note">${peer&&peer.open?'En attente du joueur 2…':'Connexion au serveur…'}</p>
    <button class="btn ghost" data-act="leave">Annuler</button></div>`;
  if(mode==='online')return `<div class="lobby">${logo}<p class="note">Connexion à la partie ${esc(code)}…</p><button class="btn ghost" data-act="leave">Annuler</button></div>`;
  const pre=(location.hash.slice(1).toUpperCase().match(/^[A-Z]{4}$/)||[''])[0];
  return `<div class="lobby">${logo.replace('</div></div>','</div><div class="tag">Duel à 2 joueurs · démo</div></div>')}
   <div class="stack">
    <input id="name" class="namefield" maxlength="16" placeholder="Ton prénom" autocomplete="off" aria-label="Ton prénom" value="${esc(myName)}">
    ${pre?`<button class="btn gold" data-act="join" data-code="${pre}">Rejoindre la partie ${pre}</button>`:`<button class="btn gold" data-act="create">Créer une partie en ligne</button>`}
    <div class="join"><input id="code" maxlength="4" placeholder="CODE" autocomplete="off" aria-label="Code de la partie" value="${pre}"><button class="btn ghost" data-act="join">Rejoindre</button></div>
    ${pre?`<button class="btn ghost" data-act="create">Créer une autre partie</button>`:''}
    <button class="btn ghost" data-act="local">Jouer à 2 sur ce téléphone</button>
   </div><div class="err">${esc(lobbyErr)}</div>
   <details class="note rules"><summary>Règles UNO MÁS</summary><ul>
    <li>Sur un +2, contre avec un +2 ou un +4. Sur un +4, contre avec un +4. Celui qui ne peut plus contrer pioche tout.</li>
    <li>Si la carte piochée est jouable, tu peux la poser tout de suite.</li>
    <li>Interdit de finir sur une carte spéciale : tu la poses, mais tu pioches 1.</li>
    <li>Plusieurs Inversions se posent d'un coup.</li>
    <li>Un même chiffre dans 2, 3 ou 4 couleurs se pose d'un coup.</li>
    <li>À 2 joueurs, Passe et Inversion te font rejouer.</li></ul></details>
   <p class="note">En ligne : chacun ouvre cette page sur son téléphone. L'un crée la partie, l'autre tape le code. Pas besoin de compte.</p></div>`;
}
function finish(){
  if(toastMsg){const t=document.createElement('div');t.className='toast';t.textContent=toastMsg;document.getElementById('app').appendChild(t)}
}

// ---------- Actions ----------
async function commit(ns){
  if(mode==='local'){
    S=ns;saidUno=false;
    if(ns.winner<0&&ns.turn!==me){me=ns.turn;covered=true}
    render();return;
  }
  S=ns;saidUno=false;render();
  if(conn&&conn.open)conn.send({t:'state',s:ns});else toast("L'adversaire n'est pas connecté : ton coup partira quand il reviendra.");
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;act(el.dataset.act,el);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act][role=button]')){e.preventDefault();act(e.target.dataset.act,e.target)}
  if(e.key==='Enter'&&e.target.id==='code')act('join');
});
async function act(a,el){
  const myTurn=S&&S.turn===me&&S.winner<0;
  switch(a){
    case 'play':{if(!myTurn)return;const i=+el.dataset.i;const c=hand(S,me)[i];
      if(S.drew&&i!==hand(S,me).length-1)return;
      if(col(c)==='k'){picking=i;render();return}
      const cb=comboFor(S,me,i);if(cb){combo={...cb,i};render();return}
      commit(doPlay(S,me,i,null,saidUno));break}
    case 'one':{const i=combo.i;combo=null;commit(doPlay(S,me,i,null,saidUno));break}
    case 'allR':{const idxs=combo.idxs.filter(j=>j!==combo.i).concat(combo.i);combo=null;commit(doPlay(S,me,idxs,null,saidUno));break}
    case 'fam':{const t=el.dataset.c,by=combo.by;const idxs=Object.keys(by).filter(k=>k!==t).map(k=>by[k]).concat(by[t]);combo=null;commit(doPlay(S,me,idxs,null,saidUno));break}
    case 'cancelcombo':combo=null;render();break;
    case 'color':{const i=picking;picking=-1;commit(doPlay(S,me,i,el.dataset.c,saidUno));break}
    case 'cancelpick':picking=-1;render();break;
    case 'draw':if(myTurn&&!S.drew)commit(doDraw(S,me));break;
    case 'pass':if(myTurn&&S.drew)commit(doPass(S,me));break;
    case 'uno':saidUno=!saidUno;if(saidUno&&hand(S,me).length>2)toast('UNO se dit quand tu poses ton avant-dernière carte');render();break;
    case 'catch':if(S.uno===1-me)commit(doCatch(S,me));break;
    case 'again':{const ns=freshState(S.players);ns.names=S.names;ns.rev=S.rev+1;ns.turn=S.winner===0?1:0;ns.log=P(ns.turn)+' commence';if(mode==='local'){me=ns.turn;covered=true}commit(ns);break}
    case 'reveal':covered=false;render();break;
    case 'askquit':quitAsk=true;render();break;
    case 'stay':quitAsk=false;render();break;
    case 'quit':{quitAsk=false;const c=conn;conn=null;try{if(c&&c.open)c.send({t:'bye'})}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}lobbyErr='';setTimeout(leave,150);break}
    case 'leave':lobbyErr='';leave();break;
    case 'local':mode='local';me=0;covered=false;S=freshState(['A','B']);render();break;
    case 'create':saveName();createGame();break;
    case 'join':saveName();joinGame((el.dataset.code||document.getElementById('code')?.value||'').trim().toUpperCase());break;
    case 'copy':copyLink();break;
  }
}
function leave(){
  try{if(conn)conn.close()}catch(e){}try{if(peer)peer.destroy()}catch(e){}
  conn=null;peer=null;mode=null;S=null;code=null;isHost=false;picking=-1;combo=null;covered=false;render();
}
function saveName(){const v=(document.getElementById('name')?.value||'').trim().slice(0,16);myName=v;store.set('unomas.name',v)}
function copyLink(){
  const url=location.origin+location.pathname+'#'+code;
  navigator.clipboard.writeText(url).then(()=>toast('Lien copié : envoie-le à ton adversaire'),()=>toast(url));
}

// ---------- En ligne : connexion directe entre les deux téléphones (PeerJS) ----------
function peerOpts(){
  const q=new URLSearchParams(location.search).get('srv');if(!q)return{debug:0};
  const [host,port]=q.split(':');return{host,port:+port,path:'/',secure:false,debug:0};
}
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];return c}
function fail(msg){leave();lobbyErr=msg;render()}
function createGame(){
  lobbyErr='';code=newCode();isHost=true;mode='online';me=0;S=null;
  peer=new Peer('unomas-'+code,peerOpts());
  peer.on('open',()=>render());
  peer.on('connection',c=>{
    if(conn&&conn.open){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),400)});return}
    conn=c;wire(c);
  });
  peer.on('disconnected',()=>{if(peer&&!peer.destroyed)peer.reconnect()});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){try{peer.destroy()}catch(_){}createGame();return}
    if(e.type==='peer-unavailable')return;
    fail('Connexion impossible ('+e.type+'). Vérifie ton réseau et réessaie.');
  });
  render();
}
function joinGame(c){
  lobbyErr='';if(!/^[A-Z]{4}$/.test(c||'')){lobbyErr='Le code fait 4 lettres.';render();return}
  code=c;isHost=false;mode='online';me=1;S=null;
  peer=new Peer(peerOpts());
  peer.on('open',()=>{const k=peer.connect('unomas-'+c,{reliable:true});conn=k;wire(k);k.on('open',()=>k.send({t:'hello',name:myName}))});
  peer.on('error',e=>fail(e.type==='peer-unavailable'?'Aucune partie avec le code '+c+'. Vérifie le code ou demande un nouveau lien.':'Connexion impossible ('+e.type+'). Vérifie ton réseau et réessaie.'));
  render();
}
function wire(c){
  c.on('data',m=>onData(c,m));
  c.on('close',()=>{if(conn!==c)return;conn=null;
    if(isHost){toast("L'adversaire s'est déconnecté. Il peut revenir avec le même code.");render()}
    else fail("La partie s'est arrêtée : le créateur de la partie a quitté.");});
}
function onData(c,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='full'){fail('Cette partie a déjà 2 joueurs.');return}
  if(m.t==='bye'){conn=null;fail((S&&S.names&&S.names[1-me]||'Ton adversaire')+' a quitté la partie.');return}
  if(m.t==='hello'&&isHost){
    const nm=String(m.name||'').slice(0,16);
    if(!S){S=freshState(['h','g']);S.log='La partie commence !'}
    S.names=[myName,nm];S.rev++;c.send({t:'state',s:S});render();return;
  }
  if(m.t==='state'&&m.s&&Array.isArray(m.s.discard)){
    if(S&&m.s.rev<S.rev)return;
    S=m.s;if(S.turn!==me){picking=-1;combo=null}render();
  }
}

// ---------- Démarrage ----------
render();
</script>
